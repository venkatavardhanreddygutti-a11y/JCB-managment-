<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a2533"/>
      <stop offset="60%" stop-color="#04141f"/>
      <stop offset="100%" stop-color="#020b12"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d2ff" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.25"/>
    </pattern>

    <!-- Major CAD Grid -->
    <pattern id="cadMajorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#cadGrid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.22"/>
    </pattern>

    <!-- Glowing Cyan Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Teal Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  
  <!-- Technical Grid Overlay -->
  <rect width="1600" height="1000" fill="url(#cadMajorGrid)"/>

  <!-- Blueprint Header Technical Markings -->
  <g stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1" fill="none" font-family="monospace" font-size="10">
    <line x1="50" y1="30" x2="1550" y2="30"/>
    <line x1="50" y1="970" x2="1550" y2="970"/>
    <text x="60" y="22" fill="#00f0ff" fill-opacity="0.5">JCB FLEET SPECIFICATIONS // SYSTEM MODEL-3CX / 4CX WIREFRAME SCHEMATIC</text>
    <text x="1350" y="22" fill="#00f0ff" fill-opacity="0.5">SCALE: 1:25 ARCH-D</text>
  </g>

  <!-- TOP-LEFT: BACKHOE LOADER WIREFRAME (JCB 3CX style) -->
  <g transform="translate(80, 60)" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" fill="none" filter="url(#cyanGlow)">
    <!-- Main Chassis & Cab -->
    <polygon points="120,220 120,130 180,100 280,100 320,150 320,220"/>
    <rect x="185" y="105" width="90" height="60" stroke-dasharray="3,3"/>
    <!-- Cab Window Glass Wireframe -->
    <line x1="185" y1="105" x2="275" y2="165"/>
    <line x1="275" y1="105" x2="185" y2="165"/>
    <!-- Rear Big Wheels -->
    <circle cx="160" cy="240" r="55" stroke-width="1.8"/>
    <circle cx="160" cy="240" r="40" stroke-dasharray="4,4"/>
    <circle cx="160" cy="240" r="20"/>
    <line x1="105" y1="240" x2="215" y2="240"/>
    <line x1="160" y1="185" x2="160" y2="295"/>
    <!-- Front Small Wheels -->
    <circle cx="340" cy="255" r="35" stroke-width="1.8"/>
    <circle cx="340" cy="255" r="22"/>
    <circle cx="340" cy="255" r="10"/>
    <!-- Front Loader Arm & Bucket -->
    <path d="M 310,210 L 380,200 L 440,240 L 470,220 L 485,270 L 420,270 Z" stroke-width="1.5"/>
    <!-- Bucket Teeth -->
    <line x1="485" y1="270" x2="495" y2="265"/>
    <line x1="480" y1="270" x2="490" y2="265"/>
    <line x1="475" y1="270" x2="485" y2="265"/>
    <line x1="470" y1="270" x2="480" y2="265"/>
    <!-- Hydraulic Cylinder Arms -->
    <line x1="280" y1="160" x2="390" y2="210" stroke-width="2"/>
    <line x1="330" y1="190" x2="430" y2="225" stroke-width="1.5"/>
    <!-- Backhoe Boom Arm (Rear) -->
    <path d="M 120,200 L 70,140 L 40,80 L 10,130 L 30,190" stroke-width="1.5"/>
    <path d="M 40,80 L -10,30 L -30,60 L 0,110 Z" stroke-width="1.5"/>
    <!-- Rear Bucket -->
    <path d="M -30,60 L -60,80 L -50,110 L -20,95 Z" fill="#00f0ff" fill-opacity="0.1"/>
    <!-- Dimension Text -->
    <text x="180" y="315" fill="#00f0ff" fill-opacity="0.6" font-size="10" font-family="monospace">JCB 3CX BACKHOE LOADER [OVERALL LENGTH: 5.62m]</text>
  </g>

  <!-- TOP-RIGHT: TRACKED EXCAVATOR WIREFRAME (JCB JS220 style) -->
  <g transform="translate(1000, 50)" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" fill="none" filter="url(#cyanGlow)">
    <!-- Crawler Tracks Base -->
    <rect x="50" y="220" width="280" height="60" rx="30" stroke-width="1.8"/>
    <!-- Track Wheels inside -->
    <circle cx="80" cy="250" r="22"/>
    <circle cx="130" cy="250" r="18"/>
    <circle cx="180" cy="250" r="18"/>
    <circle cx="230" cy="250" r="18"/>
    <circle cx="280" cy="250" r="22"/>
    <!-- Track Treads -->
    <line x1="50" y1="250" x2="330" y2="250" stroke-dasharray="6,4"/>
    <!-- House / Body -->
    <polygon points="100,220 100,140 220,120 260,150 260,220"/>
    <!-- Operator Cab Window Wireframe -->
    <rect x="180" y="130" width="70" height="65"/>
    <line x1="180" y1="130" x2="250" y2="195"/>
    <!-- Counterweight -->
    <rect x="100" y="150" width="40" height="70" fill="#00f0ff" fill-opacity="0.08"/>
    <!-- Main Boom Arm -->
    <path d="M 220,180 L 170,80 L 110,10 L 80,30 L 140,110 L 190,190 Z" stroke-width="1.6"/>
    <!-- Dipper Arm -->
    <path d="M 110,10 L 20,60 L 5,140 L 35,140 L 45,70 L 80,30 Z" stroke-width="1.6"/>
    <!-- Excavator Heavy Bucket -->
    <path d="M 5,140 L -25,180 L 15,210 L 35,170 Z" fill="#00f0ff" fill-opacity="0.15"/>
    <line x1="-25" y1="180" x2="-35" y2="190"/>
    <line x1="-20" y1="185" x2="-30" y2="195"/>
    <line x1="-15" y1="190" x2="-25" y2="200"/>
    <!-- Hydraulics -->
    <line x1="200" y1="160" x2="140" y2="60" stroke-width="2"/>
    <line x1="130" y1="50" x2="30" y2="90" stroke-width="1.8"/>
    <text x="80" y="305" fill="#00f0ff" fill-opacity="0.6" font-size="10" font-family="monospace">JCB JS220 HEAVY EXCAVATOR [DIG DEPTH: 6.5m]</text>
  </g>

  <!-- BOTTOM-LEFT: VIBRATORY ROAD ROLLER WIREFRAME -->
  <g transform="translate(100, 580)" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" fill="none" filter="url(#cyanGlow)">
    <!-- Big Front Steel Roller Drum -->
    <circle cx="100" cy="200" r="75" stroke-width="2"/>
    <circle cx="100" cy="200" r="55" stroke-dasharray="5,5"/>
    <circle cx="100" cy="200" r="25"/>
    <line x1="25" y1="200" x2="175" y2="200"/>
    <line x1="100" y1="125" x2="100" y2="275"/>
    <!-- Drum Frame Yoke -->
    <polygon points="100,200 180,180 200,220 100,220"/>
    <!-- Rear Chassis & Cab -->
    <polygon points="200,220 200,120 270,90 370,90 400,140 400,220"/>
    <rect x="270" y="100" width="90" height="70"/>
    <line x1="270" y1="100" x2="360" y2="170"/>
    <!-- Rear Big Rubber Tires -->
    <circle cx="340" cy="210" r="55" stroke-width="1.8"/>
    <circle cx="340" cy="210" r="38"/>
    <circle cx="340" cy="210" r="18"/>
    <text x="120" y="295" fill="#00f0ff" fill-opacity="0.6" font-size="10" font-family="monospace">JCB VM117 VIBRATORY COMPACTOR ROLLER</text>
  </g>

  <!-- BOTTOM-RIGHT: WHEEL LOADER / BULLDOZER WIREFRAME -->
  <g transform="translate(980, 560)" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2" fill="none" filter="url(#cyanGlow)">
    <!-- Main Body & Cab -->
    <polygon points="100,220 100,130 160,95 280,95 320,140 320,220"/>
    <rect x="170" y="105" width="100" height="65"/>
    <!-- Front Wheel -->
    <circle cx="320" cy="225" r="50" stroke-width="1.8"/>
    <circle cx="320" cy="225" r="32" stroke-dasharray="4,3"/>
    <circle cx="320" cy="225" r="16"/>
    <!-- Rear Wheel -->
    <circle cx="130" cy="225" r="50" stroke-width="1.8"/>
    <circle cx="130" cy="225" r="32" stroke-dasharray="4,3"/>
    <circle cx="130" cy="225" r="16"/>
    <!-- Massive Front Bucket Assembly -->
    <path d="M 310,200 L 390,170 L 460,210 L 480,260 L 400,265 Z" stroke-width="1.6" fill="#00f0ff" fill-opacity="0.08"/>
    <line x1="480" y1="260" x2="495" y2="255"/>
    <line x1="475" y1="260" x2="490" y2="255"/>
    <line x1="470" y1="260" x2="485" y2="255"/>
    <!-- Lift Arms & Actuators -->
    <line x1="260" y1="160" x2="380" y2="180" stroke-width="2.5"/>
    <line x1="290" y1="190" x2="410" y2="220" stroke-width="1.8"/>
    <text x="140" y="295" fill="#00f0ff" fill-opacity="0.6" font-size="10" font-family="monospace">JCB 437 WHEEL LOADER [OPERATING WEIGHT: 15.3 TONNES]</text>
  </g>

  <!-- Technical Center Compass & Crosshairs -->
  <g transform="translate(800, 500)" stroke="#00f0ff" stroke-opacity="0.2" fill="none">
    <circle cx="0" cy="0" r="180" stroke-dasharray="6,6"/>
    <circle cx="0" cy="0" r="120"/>
    <circle cx="0" cy="0" r="40"/>
    <line x1="-220" y1="0" x2="220" y2="0"/>
    <line x1="0" y1="-220" x2="0" y2="220"/>
    <!-- Angle Markers -->
    <text x="130" y="-130" fill="#00f0ff" fill-opacity="0.3" font-size="9" font-family="monospace">N 45° E</text>
    <text x="-160" y="150" fill="#00f0ff" fill-opacity="0.3" font-size="9" font-family="monospace">S 45° W</text>
  </g>
</svg>
